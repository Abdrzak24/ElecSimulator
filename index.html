<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181b22" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ElecSim">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Home Electrical Simulator</title>
<style>
:root{--bg:#f3f4f6;--pn:#fff;--ink:#111827;--mut:#6b7280;--bd:#d1d5db;--ac:#2563eb;box-sizing:border-box;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--pn:#181b22;--ink:#e5e7eb;--mut:#9ca3af;--bd:#2d3340;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#tb{display:flex;gap:4px;align-items:center;padding:6px;background:var(--pn);border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap;flex:none}
button,select{font:inherit;color:var(--ink);background:var(--pn);border:1px solid var(--bd);border-radius:8px;min-height:36px;min-width:36px;padding:0 9px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#play{background:#16a34a;color:#fff;border-color:#15803d;font-weight:600}
#stop{background:#dc2626;color:#fff;border-color:#b91c1c;font-weight:600}
.sep{width:1px;height:24px;background:var(--bd);margin:0 3px;flex:none}
.wk{width:36px;color:#fff;font-weight:700}
#ctx{flex:none;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:5px 8px;min-height:34px;background:var(--pn);border-bottom:1px solid var(--bd);font-size:13px}
#ctx b{margin-right:4px}
main{flex:1;min-height:0;display:grid;grid-template-columns:230px 1fr 230px}
.panel{background:var(--pn);overflow:auto;padding:8px}
#left{border-right:1px solid var(--bd)}#right{border-left:1px solid var(--bd)}
.panel h3{margin:10px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.panel h3:first-child{margin-top:0}
#pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pi{display:flex;flex-direction:column;align-items:center;padding:3px;font-size:11px;min-height:0;height:auto;line-height:1.2}
.pi svg{width:100%;height:56px;background:#fff;color:#111;border-radius:6px}
#cv{position:relative;min-width:0;min-height:0}
#svg{width:100%;height:100%;display:block;touch-action:none;background:#fff;color:#111;user-select:none}
.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb{font:11px sans-serif;fill:#374151;text-anchor:middle}
.lt{font:600 9px sans-serif;fill:#fff;text-anchor:middle}
.term{fill:transparent;cursor:crosshair}
.body{fill:transparent;cursor:grab}
.hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.flow{stroke:#fff;stroke-width:2;fill:none;stroke-dasharray:3 9;animation:fl .6s linear infinite}
@keyframes fl{to{stroke-dashoffset:-12}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp .5s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.mt{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px}
.mt small{color:var(--mut);display:block}
.mt .v{font:600 22px ui-monospace,monospace}
#st{font-weight:600}
canvas{width:100%;background:#0b1220;border-radius:8px;display:block}
#log{font:12px ui-monospace,monospace;color:var(--mut);max-height:120px;overflow:auto}
#nav{display:none}dialog{background:var(--pn);color:var(--ink);border:1px solid var(--bd);border-radius:12px;max-width:92vw}dialog textarea{width:min(80vw,440px);height:170px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--bd);border-radius:8px}
@media (max-width:820px),(max-height:520px){
 main{grid-template-columns:1fr}
 .panel{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));max-height:42vh;z-index:5;transform:translateY(120%);transition:transform .2s;border:0;border-top:1px solid var(--bd);box-shadow:0 -4px 16px #0003}
 .panel.open{transform:none}
 #pal{grid-template-columns:repeat(4,1fr)}
 #nav{display:flex;gap:6px;padding:5px 8px;background:var(--pn);border-top:1px solid var(--bd);flex:none}
 #nav button{flex:1}
 #left .pi{font-size:10px}
}
.mob,#more,.brk{display:none}#tb1,#tb2{display:contents}#tb button,#tb select{flex:none}#zl{min-width:38px;text-align:center}#st{font-size:13px}
@media (max-width:820px),(max-height:520px){
#tb{flex-direction:column;align-items:stretch;overflow:visible;white-space:normal;gap:6px}
#tb1{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mob,#more{display:inline-block}.brk{display:block;flex-basis:100%;height:0}.lab{display:none}
#tb2{display:none;flex-wrap:wrap;gap:5px;align-items:center;padding-top:6px;border-top:1px solid var(--bd)}
#tb.open #tb2{display:flex}
button,select{font-size:16px;min-height:42px;min-width:42px}
dialog textarea{font-size:16px}#ctx{font-size:12px}
.panel{bottom:0!important;max-height:48vh!important;padding-bottom:72px!important}
}
#fl{position:absolute;top:6px;left:6px;display:flex;gap:6px;z-index:4}
#fl button{min-height:38px;min-width:38px;padding:0 9px;font-size:16px;opacity:.92;box-shadow:0 1px 4px #0003}
#fl .fp{display:none}body.full #fl .fp{display:inline-block}
#fl #fpl{background:#16a34a;color:#fff;border-color:#15803d}#fl #fst{background:#dc2626;color:#fff;border-color:#b91c1c}
body.full #tb,body.full #ctx{display:none}
@media (max-height:520px){.brk{display:none!important}#tb1{flex-wrap:nowrap;overflow-x:auto}#tb{padding:4px 6px;gap:4px}#ctx:has(>.hint){display:none}.panel{max-height:62vh!important}}
@media (max-width:820px),(max-height:520px){.hint,#ctx:has(>.hint){display:none}.panel{max-height:36vh!important}}
@media (max-height:520px){#pal{grid-template-columns:repeat(3,1fr)}#left.panel,#right.panel{top:0;bottom:0;max-height:none!important;width:46vw;padding-bottom:12px!important}#left.panel{right:auto}#right.panel{left:auto}}
:root[data-theme="dark"]{--bg:#0f1115;--pn:#181b22;--ink:#e5e7eb;--mut:#9ca3af;--bd:#2d3340;color-scheme:dark}
#fl{right:6px;flex-wrap:wrap;gap:5px;pointer-events:none}#fl button{pointer-events:auto;min-width:36px;min-height:36px;padding:0 8px;font-size:15px}
</style></head><body>
<div id="app">
<header id="tb">
 <div id="tb1">
  <button id="play" data-a="play" title="Start simulation">▶<span class="lab"> Play</span></button>
  <button id="stop" data-a="stop" title="Stop simulation">■<span class="lab"> Stop</span></button>
  <button id="bu" data-a="undo" title="Undo">↶</button><button id="br" data-a="redo" title="Redo">↷</button>
  <button id="bro" data-a="rot" title="Rotate selected">⟳</button><button id="bd" data-a="del" title="Delete selected">🗑</button>
  <button id="more" data-a="more" title="More tools">⋯</button>
  <span class="brk"></span>
  <button data-a="zout" title="Zoom out">−</button><span id="zl">100%</span><button data-a="zin" title="Zoom in">+</button><button data-a="fit" title="Fit circuit to screen">⤢</button>
  <button class="mob" data-p="left">Parts</button><button class="mob" data-p="right">Meters</button><span id="st"></span>
 </div>
 <div id="tb2">
  <button id="bm" data-a="move" title="Enable/disable moving components">✥ Move</button>
  <button id="bg" data-a="grid" title="Toggle grid">▦ Grid</button>
  <button data-a="dup" title="Duplicate selected">⧉ Copy</button>
  <button class="wk" data-a="wL" id="wL" style="background:#dc2626" title="Live wire">L</button>
  <button class="wk" data-a="wN" id="wN" style="background:#2563eb" title="Neutral wire">N</button>
  <button class="wk" data-a="wE" id="wE" style="background:#16a34a" title="Earth wire">E</button><button class="wk" data-a="wP" id="wP" style="background:#ea580c" title="DC + wire">+</button><button class="wk" data-a="wM" id="wM" style="background:#111827" title="DC − wire">−</button>
  <select id="gm" title="Display mode for all components"><option value="real">Realistic</option><option value="sch">Schematic</option><option value="hyb">Hybrid</option></select>
  <select id="ex" title="Learning examples"><option value="">Examples…</option><option value="stair">Staircase 2-way light</option><option value="hall">Hallway intermediate</option><option value="kitchen">Kitchen RCD + socket</option><option value="garage">Relay-controlled motor</option></select>
  <button data-a="theme">◐ Theme</button><button data-a="demo">Demo</button><button id="bp" data-a="probe" title="Multimeter probe">🔍 Probe</button><button data-a="check">✓ Check</button><button data-a="save">Export</button><button data-a="load">Import</button><button data-a="clear">Clear</button>
 </div>
</header>
<div id="ctx"></div>
<main>
 <aside id="left" class="panel"><div id="pal"></div></aside>
 <div id="cv"><svg id="svg"><g id="vp"></g></svg><div id="fl"><button data-a="full" title="Full screen / show toolbar">⛶</button><button class="fp" id="fpl" data-a="play">▶</button><button class="fp" id="fst" data-a="stop">■</button><button class="fp" data-a="undo">↶</button><button class="fp" data-a="rot">⟳</button><button class="fp" data-a="del">🗑</button><button class="fp" data-p="left">Parts</button><button class="fp" data-p="right">Meters</button></div></div>
 <aside id="right" class="panel">
  <h3>Instruments</h3>
  <div class="mt"><small>Supply</small><select id="sup"><option value="230">230 V / 50 Hz</option><option value="120">120 V / 60 Hz</option></select></div>
  <div class="mt"><small>AC Voltmeter</small><span class="v" id="iv">0.0</span> V</div>
  <div class="mt"><small>Ammeter</small><span class="v" id="ii">0.00</span> A</div>
  <div class="mt"><small>Wattmeter</small><span class="v" id="ip">0</span> W<small id="ie">0.00 Wh</small></div>
  <div class="mt"><small>Solar &amp; battery</small>Sun <input id="sun" type="range" min="0" max="100" value="80" style="width:100%"><br>PV <b id="spv">0</b> W · DC load <b id="sdc">0</b> W<br>Battery <b id="ssoc">–</b><br>Time speed <select id="spd"><option value="1">1×</option><option value="60" selected>60×</option><option value="600">600×</option></select></div><div class="mt"><small>Oscilloscope (V yellow, I cyan)</small><canvas id="scope" width="440" height="200"></canvas></div>
  <div class="mt"><small>Multimeter (🔍 Probe, tap two terminals)</small><div id="mm">–</div></div><h3>Event log</h3><div id="log"></div>
 </aside>
</main>
<dialog id="dl"><h3 id="dh" style="margin:0 0 8px"></h3><textarea id="dt"></textarea><div style="margin-top:8px;display:flex;gap:6px"><button id="dok">OK</button><button id="dcl">Close</button></div></dialog>

</div>
<script>
const $=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const KC={L:'#dc2626',N:'#2563eb',E:'#16a34a','':'#9ca3af'},WC={L:'#c0392b',N:'#2563eb',E:'#16a34a'};
const SC=1.5,TR=matchMedia('(pointer:coarse)').matches?14:9;let probe=0,pr=[],dcb=null,SUN=80,SPEED=60;let SUP={v:230,f:50},R={V:0,I:0,P:0},Wh=0;
const P=(d,st='')=>`<path class="s" d="${d}" style="${st}"/>`;
const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="2.5" fill="currentColor"/>`;
const plate=(lab,hi)=>`<rect x="-28" y="-26" width="56" height="52" rx="6" fill="#f8f7f2" stroke="#9ca3af" stroke-width="2"/><rect x="-12" y="-17" width="24" height="34" rx="3" fill="#e5e7eb" stroke="#9ca3af"/><rect x="-12" y="${hi?-17:0}" width="24" height="17" rx="3" fill="#6b7280" opacity=".55"/><text class="lb" y="4" style="font-size:10px">${lab}</text>`;
const mod=(c,x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#d9dde3" stroke="#8a94a3" stroke-width="2"/><rect x="${x+4}" y="${y+(c.s.on?4:h/2)}" width="${w-8}" height="${h/2-4}" rx="2" fill="${c.s.on?'#16a34a':'#dc2626'}"/>`;
const MS=c=>P('M-40 0H-16M16 0H40')+`<circle class="s" r="16" style="fill:${c.lit?'#bbf7d0':'none'}"/><text class="lb" y="5" style="font-size:15px">M</text>`;
const AB={A:[-40,0,''],B:[40,0,'']};
const AS=t=>c=>P('M-40 0H-24M24 0H40')+`<rect class="s" x="-24" y="-16" width="48" height="32" rx="3" style="fill:${c.lit?'#bbf7d0':'none'}"/><text class="lb" y="4" style="font-size:11px">${t}</text>`;
const bar=(k,col)=>({n:k=='N'?'Neutral Bar':'Earth Bar',w:80,h:60,lx:30,s:{},t:{A:[-40,-20,k],B:[-40,20,k],C:[40,-20,k],D:[40,20,k]},sch:c=>P('M-40 -20H0M-40 20H0M0 -20H40M0 20H40')+`<rect x="-4" y="-24" width="8" height="48" fill="currentColor"/>`,real:c=>`<rect x="-30" y="-26" width="60" height="52" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><rect x="-6" y="-22" width="12" height="44" rx="2" fill="${col}"/>`+[-14,14].map(x=>[-14,14].map(y=>`<circle cx="${x}" cy="${y}" r="4" fill="#6b7280"/>`).join('')).join('')});
const TY={
src:{n:'AC Source',w:80,h:60,lx:28,s:{},t:{L:[40,-20,'L'],N:[40,0,'N'],E:[40,20,'E']},

 real:c=>`<rect x="-28" y="-26" width="56" height="52" rx="6" fill="#1e3a5f"/><rect x="-22" y="-20" width="44" height="26" rx="3" fill="#0b1220"/><path d="M-18 -7q4.5-10 9 0t9 0t9 0t9 0" stroke="#4ade80" fill="none" stroke-width="2"/><text class="lt" y="21">${SUP.v}V ${SUP.f}Hz</text>`},
lamp:{n:'Lamp',w:80,h:60,lx:17,s:{},t:{A:[-40,0,''],B:[40,0,'']},
 sch:c=>P('M-40 0H-14M14 0H40M-10 -10L10 10M10 -10L-10 10')+`<circle class="s" r="14" style="fill:${c.lit?'#ffe066':'none'}"/>`,

led:{n:'LED',w:80,h:60,lx:12,s:{},t:{A:[-40,0,''],B:[40,0,'']},

 real:c=>(c.lit?'<circle r="30" fill="url(#gr)"/>':'')+`<path d="M-10 12V-6A10 10 0 0 1 10 -6V12Z" fill="${c.lit?'#ff5252':'#9b2c2c'}" stroke="#7f1d1d" stroke-width="2"/><rect x="-13" y="12" width="26" height="4" fill="#9ca3af"/><path d="M-5 16V24M5 16V24" stroke="#6b7280" stroke-width="2"/>`},
sw1:{n:'1-way Switch',w:80,h:60,lx:28,s:{on:0},t:{A:[-40,0,''],B:[40,0,'']},

sw2:{n:'2-way Switch',w:80,h:60,lx:28,s:{pos:0},t:{C:[-40,0,''],L1:[40,-20,''],L2:[40,20,'']},

bell:{n:'Bell / Buzzer',w:80,h:60,lx:18,s:{},t:{A:[-40,0,''],B:[40,0,'']},
 sch:c=>P('M-40 0H-14M14 0H40M-14 10Q-14 -12 0 -12Q14 -12 14 10ZM-4 16H4')+(c.lit?P('M20 -12Q27 -5 20 2M24 -18Q35 -5 24 8','stroke:#dc2626'):''),
