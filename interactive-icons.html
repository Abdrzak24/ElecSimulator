<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ElecSim – Interactive 3D icons</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--ring:#2563eb;--on:#16a34a;--off:#94a3b8}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#152036;--ink:#e2e8f0;--mut:#94a3b8;--ring:#60a5fa;--on:#4ade80;--off:#64748b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;touch-action:manipulation}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;padding:14px 14px 40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:19px;margin:0;flex:1 1 220px}
button.ctl,label.ctl{background:var(--card);color:var(--ink);border:1px solid #64748b44;border-radius:10px;padding:9px 13px;font-size:14px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
input[type=range]{width:110px}
h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{margin:0;background:var(--card);border-radius:16px;padding:10px 8px 12px;text-align:center;box-shadow:0 1px 5px #0002;transition:box-shadow .25s}
.card:has(.ic.on){box-shadow:0 0 0 2px var(--on),0 4px 16px #0003}
.ic{width:100%;max-width:140px;margin:0 auto;aspect-ratio:1;cursor:pointer;outline:none;border-radius:14px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ic:focus-visible{box-shadow:0 0 0 3px var(--ring)}
.ic svg{width:100%;height:100%;display:block;overflow:visible}
figcaption{font-size:13px;font-weight:650;margin-top:4px}
.st{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--off);color:#fff;vertical-align:1px}
.card:has(.ic.on) .st{background:var(--on)}
.tip{display:block;font-size:11px;color:var(--mut);font-weight:500;margin-top:2px}
/* ---- shared effects */
.dim{opacity:1;transition:opacity .35s;pointer-events:none}.ic.on .dim{opacity:0}
.glow{opacity:0;transition:opacity .25s;pointer-events:none}.ic.on .glow{opacity:1}
.onlit{opacity:0;transition:opacity .25s;pointer-events:none}.ic.on .onlit{opacity:1}
.offlit{opacity:1;transition:opacity .25s;pointer-events:none}.ic.on .offlit{opacity:0}
.gled,.gglow{opacity:0;transition:opacity .15s}.gi.on .gled,.gi.on .gglow{opacity:1}
.gi .rkf{transition:transform .12s}.gi.on .rkf{transform:translateY(16px)}
.lever{transition:transform .13s cubic-bezier(.3,1.6,.5,1),filter .13s;transform:translateY(18px);filter:grayscale(.7) brightness(.75)}
.ic:not(.t-db).on .lever{transform:none;filter:none}
.t-rcd .lever,.t-rcbo .lever{transform:translateY(7px)}.t-cb .lever{transform:translateY(14px)}.t-db .lever{transform:translateY(9px)}
.t-rcd.on .lever,.t-rcbo.on .lever,.t-cb.on .lever{transform:none}
.t-db .brk.on .lever{transform:none;filter:none}.brk{cursor:pointer}
.rot90{transition:transform .25s cubic-bezier(.3,1.5,.5,1);transform:rotate(90deg)}.ic.on .rot90{transform:none}
.btn{transition:transform .06s}.ic.on .btn{transform:translateY(4px)}
.plug{transform:translate(36px,-22px) rotate(16deg);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}.ic.on .plug{transform:none}
.tbtn{transition:transform .08s;cursor:pointer}.tbtn.pr{transform:scale(.8)}
.arm{transition:transform .05s}.ic.on .arm{transform:rotate(-8deg)}
.ic.on .swing{animation:swing .11s ease-in-out infinite alternate}@keyframes swing{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.dot{opacity:0}.ic.on .dot{opacity:1}
.dl{animation:dl 1s linear infinite}@keyframes dl{from{transform:translateX(0)}to{transform:translateX(-22px);opacity:0}}
.dd{animation:dd 1s linear infinite}@keyframes dd{from{transform:translateY(0)}to{transform:translateY(22px);opacity:0}}
.dr{animation:dr 1s linear infinite}@keyframes dr{from{transform:translateX(0)}to{transform:translateX(22px);opacity:0}}
.steam{animation:steam 1.6s ease-out infinite}@keyframes steam{from{transform:translate(0,0) scale(.5);opacity:.8}to{transform:translate(-10px,-30px) scale(1.8);opacity:0}}
.smoke{animation:smoke 1.8s ease-out infinite}@keyframes smoke{from{transform:translate(0,0) scale(.5);opacity:.7}to{transform:translate(6px,-34px) scale(2);opacity:0}}
.wind{animation:wind 1.4s ease-in-out infinite}@keyframes wind{0%{transform:translateX(-8px);opacity:0}30%{opacity:1}100%{transform:translateX(16px);opacity:0}}
.knurl{animation:knurl .12s linear infinite}@keyframes knurl{to{stroke-dashoffset:-5.5}}
.seg{animation:seg 1.1s infinite}@keyframes seg{0%,100%{opacity:.15}50%{opacity:1}}
.glint{animation:sweep 2.4s ease-in-out infinite}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(105px)}}
.bars{animation:bars 1.6s linear infinite}@keyframes bars{to{transform:translateX(20px)}}
.heat .glow,.heat{animation:heat 2.2s ease-in-out infinite}@keyframes heat{50%{opacity:.7}}
.ic.flick .glow,.ic.flick .tubecore{animation:flick .9s steps(1) 1}@keyframes flick{0%{opacity:.1}12%{opacity:1}20%{opacity:.05}34%{opacity:.9}44%{opacity:.1}60%{opacity:1}72%{opacity:.3}100%{opacity:1}}
.ic.on.shake svg{animation:shake .09s linear infinite}.ic.on.shake2 svg{animation:shake2 .08s linear infinite}.ic.on.buzz svg{animation:buzz .04s linear infinite}
@keyframes shake{0%{transform:translate(.7px,.4px)}50%{transform:translate(-.7px,-.3px)}100%{transform:translate(.4px,-.6px)}}
@keyframes shake2{0%{transform:translate(1.6px,1px)}50%{transform:translate(-1.5px,-.8px)}100%{transform:translate(1px,-1.4px)}}
@keyframes buzz{0%{transform:translate(.25px,0)}100%{transform:translate(-.25px,.15px)}}
.ic.on.t-lamp svg{filter:drop-shadow(0 0 12px rgba(253,224,71,.55))}.ic.on.t-dclamp svg{filter:drop-shadow(0 0 12px rgba(56,189,248,.55))}
.ic.on.t-led svg{filter:drop-shadow(0 0 10px rgba(239,68,68,.6))}.ic.on.t-tube svg{filter:drop-shadow(0 0 12px rgba(254,240,138,.5))}
.ic.on.t-tv svg{filter:drop-shadow(0 0 10px rgba(56,189,248,.35))}
@media(prefers-reduced-motion:reduce){.dl,.dd,.dr,.steam,.smoke,.wind,.knurl,.seg,.glint,.bars,.heat{animation:none}}
</style></head><body>
<header><h1>⚡ ElecSim – interactive 3D icons</h1>
<button class="ctl" id="alloff">⏻ All off</button>
<button class="ctl" id="mute" aria-pressed="false">🔊 Sound on</button>
<label class="ctl">Volume <input id="vol" type="range" min="0" max="100" value="70"></label></header>
<p style="margin:0 0 4px;color:var(--mut);font-size:13px">Tap an icon to switch it on or off. Sound starts after your first tap. Hints are under each icon.</p>

function Hum(f,o={}){const c=ac(),g=c.createGain();g.gain.value=0;g.connect(M);const os=[];(o.h||[1,.5,.3]).forEach((a,i)=>{const s=c.createOscillator();s.type=o.type||'sine';s.frequency.value=f*(i+1);const gg=c.createGain();gg.gain.value=a;s.connect(gg);gg.connect(g);s.start();os.push(s)});
